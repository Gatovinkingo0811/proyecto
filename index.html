<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Para Charlotte ✨</title>
    <meta name="description" content="Una constelación para alguien especial.">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background starfield canvas -->
    <canvas id="starfield" aria-hidden="true"></canvas>

    <!-- Subtle nebula overlay -->
    <div id="nebula" aria-hidden="true"></div>

    <!-- Constelaciones reales del zodíaco orbitando (celestial.js) -->
    <canvas id="celestial-map" aria-hidden="true"></canvas>

    <!-- Universe master container (zooms out at the finale). Empieza en
         .pre-reveal: Acuario "de lado", fuera de foco -- el giro de cámara
         del inicio la centra y enfoca (ver script.js: onCinemaPhase 'turn'). -->
    <div id="universe-container" class="pre-reveal">
        <svg id="constellation-lines" aria-hidden="true"></svg>
        <div id="stars-container"></div>
    </div>

    <!-- Hint text -->
    <div id="hint"></div>

    <!-- Intro overlay (entrada escenificada, el cielo se ve a través) -->
    <div id="intro-overlay" role="dialog" aria-label="Introducción">
        <div id="intro-backdrop" aria-hidden="true"></div>
        <button id="intro-begin" type="button" aria-label="Comenzar la experiencia">Comenzar</button>
    </div>

    <!-- Message modal -->
    <div id="modal-overlay" role="dialog" aria-label="Mensaje de estrella">
        <div id="modal">
            <div class="modal-header">
                <h2 id="modal-star-name"></h2>
                <span id="modal-star-count"></span>
            </div>
            <div id="modal-content">
                <p id="modal-message"></p>
            </div>
            <button id="modal-close" type="button" aria-label="Continuar">
                <span>continuar</span>
            </button>
        </div>
    </div>

    <!-- Finale overlay -->
    <div id="finale-overlay" role="dialog" aria-label="Mensaje final">
        <div id="finale-content">
            <div id="finale-message" aria-live="polite"></div>
            <p class="finale-sign">Luis</p>
            <button id="finale-continue" type="button" aria-label="Toca para continuar">Toca para continuar</button>
        </div>
    </div>

    <button id="go-final" type="button" style="position:fixed;top:12px;left:12px;z-index:999;font-family:Inter,system-ui,sans-serif;font-size:12px;letter-spacing:.05em;padding:8px 12px;border-radius:999px;background:rgba(40,30,80,.65);border:1px solid rgba(255,205,235,.4);color:#ffd9ec;backdrop-filter:blur(6px);cursor:pointer;">ir al final</button>

    <script src="zodiac-data.js"></script>
    <script src="celestial.js"></script>
    <script src="music.js"></script>
    <script src="script.js"></script>
</body>
</html>
