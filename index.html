<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070714">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Para Charlotte ✨</title>
    <meta name="description" content="Una constelación para alguien especial.">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background starfield canvas -->
    <canvas id="starfield" aria-hidden="true"></canvas>

    <!-- Subtle nebula overlay -->
    <div id="nebula" aria-hidden="true"></div>

    <!-- Real celestial sky (all constellations, drawn on canvas) -->
    <canvas id="celestial-map" aria-hidden="true"></canvas>

    <!-- Universe master container (zooms out at the finale) -->
    <div id="universe-container">
        <!-- Radial halo that emphasizes Aquarius on the full zodiac plane -->
        <div id="aquarius-halo" aria-hidden="true"></div>

        <!-- SVG for constellation connection lines -->
        <svg id="constellation-lines" aria-hidden="true"></svg>

        <!-- Interactive constellation stars -->
        <div id="stars-container"></div>
    </div>




    <!-- Hint text -->
    <div id="hint">toca la estrella que brilla</div>

    <!-- Intro overlay (entrada escenificada, el cielo se ve a través) -->
    <div id="intro-overlay" role="dialog" aria-label="Introducción">
        <div class="intro-content">
            <p class="intro-staged" id="intro-line-1">Hay algo que quiero mostrarte…</p>
            <p class="intro-staged" id="intro-line-2">pero tendrás que descubrirlo estrella por estrella.</p>
            <h1 class="intro-title">Charlotte</h1>
            <div class="intro-line"></div>
            <p class="intro-hint">toca para comenzar</p>
        </div>
    </div>

    <!-- Message modal -->
    <div id="modal-overlay" role="dialog" aria-label="Mensaje de estrella">
        <div id="modal">
            <div class="modal-header">
                <h2 id="modal-star-name"></h2>
                <span id="modal-star-count"></span>
            </div>
            <div id="modal-content">
                <p id="modal-message"></p>
            </div>
            <button id="modal-close" type="button" aria-label="Continuar">
                <span>continuar</span>
            </button>
        </div>
    </div>

    <!-- Estrella misteriosa del final (elemento narrativo independiente) -->
    <div id="mystery-star" aria-hidden="true">
        <div class="mystery-dot"></div>
    </div>

    <!-- Finale overlay -->
    <div id="finale-overlay" role="dialog" aria-label="Mensaje final">
        <div id="finale-content">
            <div id="finale-message" aria-live="polite"></div>
            <p class="finale-sign">Luis</p>
        </div>
    </div>

    <button id="go-final" type="button" style="position:fixed;top:12px;left:12px;z-index:999;font-family:Inter,system-ui,sans-serif;font-size:12px;letter-spacing:.05em;padding:8px 12px;border-radius:999px;background:rgba(40,30,80,.65);border:1px solid rgba(255,205,235,.4);color:#ffd9ec;backdrop-filter:blur(6px);cursor:pointer;">ir al final</button>

    <script src="celestial.js"></script>
    <script src="script.js"></script>
</body>
</html>
